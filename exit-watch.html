<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>T+1 出场监控 — A股资金流向观察</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./sniper.css?v=20261105_v12">
</head>
<body data-signal-boundary="not_a_trading_signal">
  <div class="page-shell">
    <header class="page-header">
      <div class="brand"><span class="brand-mark">⌁</span><span>FUND FLOW<small>T+1 出场监控</small></span></div>
      <div class="header-actions">
        <a class="mode-button" href="./sniper.html">狙击台(T)</a>
        <a class="mode-button" href="./sector-watch.html">板块观察(T-3)</a>
      </div>
    </header>
    <main>
      <section class="overview"><h1>T+1 出场监控 <span class="mode-label">破开盘3%止损 | 14:55清仓 | 绝不留隔夜</span></h1>
      <p class="session-description" id="exit-desc">正在载入出场记录… signal_boundary=not_a_trading_signal</p></section>
      <section><h2>已出场战绩（T+1_EXIT_DONE）</h2>
      <table class="data-table" id="exit-table"><thead><tr>
        <th>代码</th><th>名称</th><th>开盘</th><th>开盘涨幅</th><th>止损线(开-3%)</th><th>止损触发</th><th>收盘</th><th>收盘涨幅</th><th>出场判定</th>
      </tr></thead><tbody></tbody></table></section>
      <section><h2>出场待命</h2><div id="pending-exit" class="session-strip"></div></section>
    </main>
  </div>
  <script>
  fetch('./sniper-feed.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
    const rows = (d.stocks||[]).filter(s=>s.phase==='T+1_EXIT_DONE');
    const tb = document.querySelector('#exit-table tbody');
    rows.forEach(s=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${s.code}</td><td>${s.name}</td><td>${s.open??'—'}</td><td>${s.open_pct??'—'}%</td><td>${s.stop_line??'—'}</td><td>${s.stop_hit?'是':'否'}</td><td>${s.price}</td><td>${s.change_pct}%</td><td>${s.auction_reason||''}</td>`;
      tb.appendChild(tr);
    });
    const mean = rows.length? (rows.reduce((a,s)=>a+(s.change_pct||0),0)/rows.length).toFixed(2):'—';
    document.getElementById('exit-desc').textContent =
      `T+1 已出场 ${rows.length} 只，收盘均值 ${mean}%，止损触发 ${rows.filter(s=>s.stop_hit).length} 只。signal_boundary=not_a_trading_signal`;
    const w = d.lifecycle_watch?.T_plus1_exit_watch||{};
    document.getElementById('pending-exit').innerHTML =
      `<div class="session-stat"><span>今日</span><strong>${w.today_2026-11-10||'—'}</strong></div>
       <div class="session-stat"><span>明日</span><strong>${w.tomorrow_2026-11-11||'—'}</strong></div>`;
  }).catch(e=>{document.getElementById('exit-desc').textContent='feed 载入失败: '+e;});
  </script>
</body>
</html>
