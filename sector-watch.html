<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>T-3 板块观察 — A股资金流向观察</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./sniper.css?v=20261111_v13">
</head>
<body data-signal-boundary="not_a_trading_signal">
  <div class="page-shell">
    <header class="page-header">
      <div class="brand"><span class="brand-mark">⌁</span><span>FUND FLOW<small>T-3 板块观察</small></span></div>
      <div class="header-actions">
        <a class="mode-button" href="./sniper.html">狙击台(T)</a>
        <a class="mode-button" href="./exit-watch.html">出场监控(T+1)</a>
      </div>
    </header>
    <main>
      <section class="overview"><h1>T-3 主线板块观察 <span class="mode-label">近3日(11-06/09/10)累计净流入 &gt; 0，非风格板块</span></h1>
      <p class="session-description" id="sec-desc">正在载入… signal_boundary=not_a_trading_signal</p></section>
      <section><table class="data-table" id="sec-table"><thead><tr>
        <th>板块</th><th>名称</th><th>近3日净流入(亿)</th><th>近3日涨幅(%)</th><th>当日净流入(亿)</th><th>角色</th>
      </tr></thead><tbody></tbody></table></section>
    </main>
  </div>
  <script>
  fetch('./sniper-feed.json', {cache:'no-store'}).then(r=>r.json()).then(d=>{
    const rows = d.lifecycle_watch?.T_minus3_sector_watch||[];
    const tb = document.querySelector('#sec-table tbody');
    rows.forEach(x=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${x.bk}</td><td>${x.name}</td><td>${x.net3d_yi}</td><td>${x.pct3d}</td><td>${x.net_today_yi??'—'}</td><td style="max-width:420px">${x.role||''}</td>`;
      tb.appendChild(tr);
    });
    document.getElementById('sec-desc').textContent =
      `T-3 观察板块 ${rows.length} 个（net3d>0 非STYLE），个股层等 T-2 回踩缩量确认后进 T-1 候选。signal_boundary=not_a_trading_signal`;
  }).catch(e=>{document.getElementById('sec-desc').textContent='feed 载入失败: '+e;});
  </script>
</body>
</html>
