<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>KLDQX QUANT LAB · 高频集合竞价与开盘观察</title>
    <style>
        body {
            margin: 0;
            background: #0b111b;
            color: #edf3fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 48px 36px;
            background: #131d2b;
            border: 1px solid #263448;
            border-radius: 18px;
            max-width: 520px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .brand-icon {
            display: inline-grid;
            place-items: center;
            width: 48px;
            height: 48px;
            background: #15333d;
            border: 1px solid #65d6de55;
            border-radius: 14px;
            color: #65d6de;

            margin-bottom: 20px;
        }
        h1 {
            color: #edf3fb;
            font-size: 24px;
            letter-spacing: 2px;
            margin: 0 0 14px 0;
        }
        p {
            color: #93a5bc;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 10px 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1a2736;
            border: 1px solid #2d3f56;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #a9f0ef;
            margin-top: 10px;
        }
        .pulse {
            width: 8px;
            height: 8px;
            background: #73d5ac;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #73d5ac;
        }
        .footer {
            font-size: 12px;
            color: #586e88;
            margin-top: 28px;
            letter-spacing: 1px;

<body>
    <div class="container">

</body>
</html>
